<style>
:root {
  --bg:#fdf2f4;--bg2:#fce7ec;
  --rose:#c9536e;--rose-hover:#a83d59;--wine:#7c1f33;
  --rose-dim:rgba(201,83,110,0.08);--rose-border:rgba(201,83,110,0.20);
  --text:#34212b;--text2:#4a3340;--muted:#6e5560;--muted2:#9d8590;
  --border:rgba(124,31,51,0.14);
  --sans:'Plus Jakarta Sans',system-ui,sans-serif;
  --display:'Poppins',system-ui,sans-serif;
  --mono:'DM Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased;}
body{background:radial-gradient(120% 90% at 78% -6%, var(--bg2) 0%, var(--bg) 40%, #fffdfd 74%) fixed;color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.7;min-height:100vh;}
nav{position:sticky;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:18px 48px;border-bottom:1px solid var(--border);background:rgba(253,242,244,0.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);}
.nav-logo{font-family:var(--sans);font-weight:800;font-size:15px;letter-spacing:0.08em;text-transform:uppercase;color:var(--text);text-decoration:none;}
.nav-logo span{color:var(--rose);}
.nav-back{font-family:var(--mono);font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);text-decoration:none;border-bottom:1px solid var(--muted);padding-bottom:2px;transition:color 0.2s,border-color 0.2s;}
.nav-back:hover{color:var(--text);border-color:var(--text);}
.container{max-width:760px;margin:0 auto;padding:64px 48px 96px;}
.page-label{font-family:var(--mono);font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:var(--rose);display:block;margin-bottom:16px;}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,4vw,40px);line-height:1.08;letter-spacing:-0.02em;color:var(--wine);margin-bottom:8px;}
.intro-box{background:rgba(255,255,255,0.8);border:1px solid var(--border);border-radius:16px;padding:24px 28px;margin:24px 0 40px;font-size:15px;color:var(--muted);line-height:1.75;}
.intro-box a{color:var(--rose);text-decoration:none;}
.intro-box a:hover{text-decoration:underline;}
.form-wrap{background:rgba(255,255,255,0.8);border:1px solid var(--border);border-radius:16px;padding:12px;overflow:hidden;}
.form-wrap iframe{width:100%;max-width:640px;display:block;margin:0 auto;border:0;background:transparent;}
footer{padding:32px 48px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:rgba(253,242,244,0.6);flex-wrap:wrap;gap:12px;}
.footer-logo{font-family:var(--sans);font-weight:800;font-size:14px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);}
.footer-logo span{color:var(--rose);}
.footer-links{display:flex;gap:20px;}
.footer-links a{font-family:var(--mono);font-size:11px;color:var(--muted2);letter-spacing:0.06em;text-decoration:none;transition:color 0.2s;}
.footer-links a:hover{color:var(--rose);}
.footer-copy{font-family:var(--mono);font-size:11px;color:var(--muted2);letter-spacing:0.06em;}
@media(max-width:680px){nav{padding:16px 24px;}.container{padding:48px 24px 80px;}footer{padding:24px;flex-direction:column;text-align:center;}}
</style>
